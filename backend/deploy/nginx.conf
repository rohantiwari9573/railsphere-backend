# RailSphere reverse proxy - place at /etc/nginx/sites-available/railsphere
# and symlink into /etc/nginx/sites-enabled/

# Standard nginx WebSocket upgrade map: only rewrite Connection to
# "upgrade" when the client actually sent an Upgrade header (WS
# handshake); a plain HTTP request gets "close" so keep-alive on
# ordinary API calls isn't disturbed.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 16-176-230-154.nip.io;

    client_max_body_size 10M;

    # nginx.conf's global gzip_types is commented out by default, which
    # leaves gzip effectively off for this API -- its default type list
    # is just text/html, and every response here is application/json.
    # Set explicitly at the site level so a fresh deploy doesn't depend
    # on hand-editing the global config.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Without these, nginx never forwards the WebSocket upgrade
        # handshake -- GET /ws/analytics reaches the backend as a plain
        # HTTP request, Starlette's websocket-only route doesn't match
        # it, and the client sees the connection die with close code
        # 1006 instead of a real WS session.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        # A live-push WS connection is meant to stay open far longer
        # than a normal request; the existing 60s read timeout would
        # silently kill it the first time the server goes a minute
        # without pushing an analytics-refresh event.
        proxy_read_timeout 3600s;
    }
}
