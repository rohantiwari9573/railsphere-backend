name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/railsphere_test
      APP_NAME: RailSphere API
      APP_VERSION: 1.0.0
      DEBUG: "True"
      HOST: 127.0.0.1
      PORT: "8000"
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # secrets aren't directly usable in an `if:` expression at any
      # level -- routing the value through env: into a step output is
      # the standard way to gate a later step on "is this secret set",
      # without the deploy step ever running (green job, no SSH
      # attempt) until EC2_HOST and EC2_SSH_KEY exist as repo secrets.
      # See backend/deploy/README.md for exact setup steps.
      - name: Check deploy secrets are configured
        id: check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -n "$EC2_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/railsphere-backend/backend
            git pull origin main
            .venv/bin/pip install -r requirements.txt
            .venv/bin/alembic upgrade head
            sudo systemctl restart railsphere
            if systemctl is-enabled --quiet railsphere-worker 2>/dev/null; then
              sudo systemctl restart railsphere-worker
            fi
            sudo systemctl --no-pager status railsphere --lines=0
