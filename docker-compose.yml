services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: railsphere
    ports:
      # Host-side 5433 avoids clashing with a native Postgres already
      # on 5432 (e.g. this project's own non-Docker dev setup);
      # containers still reach each other via the internal 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # Jaeger UI -- open http://localhost:16686 to see traces.
      - "16686:16686"
      # OTLP/HTTP receiver, used by OTEL_EXPORTER_OTLP_ENDPOINT below.
      - "4318:4318"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &backend_env
      APP_NAME: RailSphere API
      APP_VERSION: 1.0.0
      DEBUG: "True"
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/railsphere
      SECRET_KEY: dev-only-secret-do-not-use-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CORS_ORIGINS: "http://localhost:5173"
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    # arq refreshes the analytics materialized views on a schedule
    # (app/worker.py) -- runs the same image, just a different
    # command, and skips the migration step since `backend` already
    # applies them on startup.
    entrypoint: []
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment: *backend_env

volumes:
  postgres_data:
